name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set site URL
        env:
          CHAT_API_URL: ${{ secrets.NEXT_PUBLIC_CHAT_API_URL }}
          CUSTOM_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: |
          owner=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          name="${{ github.event.repository.name }}"
          if [[ -n "$CUSTOM_SITE_URL" ]]; then
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_SITE_URL=${CUSTOM_SITE_URL}" >> "$GITHUB_ENV"
          elif [[ "$name" == *.github.io ]]; then
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_SITE_URL=https://${owner}.github.io" >> "$GITHUB_ENV"
          else
            # Custom domain chatwithyou.site is the intended prod host.
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_SITE_URL=https://chatwithyou.site" >> "$GITHUB_ENV"
          fi
          if [[ -n "$CHAT_API_URL" ]]; then
            echo "NEXT_PUBLIC_CHAT_API_URL=${CHAT_API_URL}" >> "$GITHUB_ENV"
          else
            # pay.* already points at the VPS Caddy; /api/v1/* → web-gateway.
            echo "NEXT_PUBLIC_CHAT_API_URL=https://pay.chatwithyou.site" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
